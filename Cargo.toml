[workspace]
resolver = "2"
members = ["crates/es1-dsp", "crates/es1-presets", "crates/es1-plugin", "crates/es1-vst3", "crates/es1-render", "xtask"]
exclude = ["vendor"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Claude Henchoz"]

[workspace.dependencies]
es1-dsp = { path = "crates/es1-dsp" }
es1-presets = { path = "crates/es1-presets" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3", "assert_process_allocs"] }
# Without egui's embedded fonts (1.4 MB); the editor loads system fonts instead.
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["opengl"] }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

# egui-baseview at the revision nih_plug_egui pins, with egui's embedded fonts (1.4 MB) left out
# of its default features; see vendor/README.md.
[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }

# Optimised for size, except the engine and nih-plug's audio wrapper (opt-level 3 below).
# Building the LTO root (es1-vst3, or es1-render for its benchmark) for size also came out faster
# for the engine: `es1-render --bench` 3.05 s, against 3.50 s at opt-level 3 and 3.17 s for the
# earlier thin-LTO, all-opt-level-3 profile. The per-package overrides name only non-root crates:
# an override on the crate being linked makes Cargo drop `strip`.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
debug = false
strip = true
panic = "abort"

[profile.release.package.es1-dsp]
opt-level = 3

[profile.release.package.nih_plug]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

