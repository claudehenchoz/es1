[workspace]
resolver = "2"
members = ["crates/es1-dsp", "crates/es1-presets", "crates/es1-plugin", "crates/es1-render", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Claude Henchoz"]

[workspace.dependencies]
es1-dsp = { path = "crates/es1-dsp" }
es1-presets = { path = "crates/es1-presets" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3", "assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.profiling]
inherits = "release"
debug = true
